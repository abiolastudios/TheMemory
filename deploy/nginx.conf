# Nginx site for the VPS. Replace moments.example.com with your domain, then:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/proposal-moments
#   sudo ln -s /etc/nginx/sites-available/proposal-moments /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d moments.example.com     # adds HTTPS (needed for offline mode)

server {
    listen 80;
    server_name moments.example.com;

    # Snaps are compressed on the phone to ~1 MB, but leave headroom.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Uploads on slow event Wi-Fi can take a while.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
